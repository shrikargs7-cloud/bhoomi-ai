services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: bhoomi_dev_password
      POSTGRES_DB: bhoomiai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhoomi -d bhoomiai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BHOOMI_DATABASE_URL: postgresql+psycopg2://bhoomi:bhoomi_dev_password@postgres:5432/bhoomiai
      BHOOMI_JWT_SECRET: ${BHOOMI_JWT_SECRET:-change-me-in-production}
      BHOOMI_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      BHOOMI_RATE_LIMIT_ENABLED: "true"
      BHOOMI_RATE_LIMIT_RPM: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
